<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 영화 취향 저격기 · TMDB Movie Finder</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #1B1E3A;
    --bg-deep: #12152E;
    --card: #242950;
    --card-hi: #2E3460;
    --text: #FFFFFF;
    --off: #E8EAF6;
    --muted: #A8AED1;
    --dim: #6A6F95;
    --purple: #7C6AFF;
    --purple-lt: #9F90FF;
    --teal: #5EEAD4;
    --yellow: #F5D547;
    --coral: #FF7A7A;
    --pink: #FF6B9D;
    --orange: #FFA75E;
  }

  body {
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    background: linear-gradient(135deg, var(--bg) 0%, var(--bg-deep) 100%);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
  }

  /* ============ 뷰 전환 ============ */
  .view {
    animation: fadeIn 0.35s ease-out;
  }
  .view.hidden { display: none; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* 더 보기 / 자동 불러오기 */
  .load-more-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 28px 0 10px;
  }
  .load-more-btn {
    padding: 12px 28px;
    background: var(--card);
    border: 1.5px solid var(--purple-lt);
    border-radius: 30px;
    color: var(--purple-lt);
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.15s;
  }
  .load-more-btn:hover { background: var(--purple); border-color: var(--purple); color: #fff; }
  .load-more-btn:disabled { opacity: 0.6; cursor: default; }
  .load-more-info { font-size: 12px; color: var(--dim); }

  /* 대표작 정렬 버튼 */
  .sort-tabs {
    display: inline-flex;
    gap: 6px;
    margin-left: auto;
  }
  .sort-tab {
    padding: 5px 12px;
    background: var(--card);
    border: 1px solid var(--card-hi);
    border-radius: 999px;
    color: var(--muted);
    font-family: inherit;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.15s;
  }
  .sort-tab:hover { color: var(--text); border-color: var(--purple-lt); }
  .sort-tab.active {
    background: var(--purple);
    border-color: var(--purple);
    color: #fff;
  }

  /* 상세 화면 위쪽 줄: 왼쪽 뒤로가기 · 오른쪽 홈 */
  .detail-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }
  /* 홈 버튼 — 뒤로가기와 같은 모양/높이로 맞춘다 */
  .home-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 18px;
    background: var(--card);
    border: 1px solid var(--purple-lt);
    color: var(--purple-lt);
    border-radius: 30px;
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.15s;
  }
  .home-btn:hover {
    background: var(--purple);
    border-color: var(--purple);
    color: #fff;
    transform: translateY(-2px);
  }

  header.list-header {
    text-align: center;
    padding: 20px 0 30px;
  }
  header.list-header h1 {
    font-size: 36px;
    background: linear-gradient(90deg, var(--yellow), var(--pink));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
    cursor: pointer;
  }
  header.list-header .sub {
    color: var(--muted);
    font-size: 14px;
  }
  .demo-badge {
    display: inline-block;
    margin-top: 10px;
    padding: 6px 14px;
    background: rgba(255, 167, 94, 0.15);
    border: 1px solid var(--orange);
    color: var(--orange);
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
  }

  .layout {
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 24px;
  }

  /* ============ 필터 사이드바 ============ */
  .sidebar {
    background: var(--card);
    border: 1px solid var(--card-hi);
    border-radius: 16px;
    padding: 24px;
    height: fit-content;
    position: sticky;
    top: 20px;
  }
  .sidebar h3 {
    color: var(--yellow);
    font-size: 14px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .search-box {
    position: relative;
    margin-bottom: 24px;
  }
  .search-box input {
    width: 100%;
    padding: 12px 12px 12px 38px;
    background: var(--bg);
    border: 1.5px solid var(--purple);
    border-radius: 10px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: 0.2s;
  }
  .search-box input:focus {
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.15);
  }
  .search-box::before {
    content: "🔎";
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
  }

  .filter-group { margin-bottom: 20px; }
  .filter-group label {
    display: block;
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 8px;
  }
  .filter-group label b { color: var(--teal); }

  .genre-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 6px 12px;
    background: var(--bg);
    border: 1px solid var(--card-hi);
    border-radius: 14px;
    color: var(--muted);
    font-size: 11px;
    cursor: pointer;
    transition: 0.15s;
    user-select: none;
  }
  .chip:hover { border-color: var(--purple-lt); color: var(--off); }
  .chip.active {
    background: var(--purple); border-color: var(--purple);
    color: white; font-weight: bold;
  }

  input[type="range"] {
    width: 100%; height: 6px;
    background: var(--bg); border-radius: 3px;
    outline: none; -webkit-appearance: none;
    accent-color: var(--purple);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    background: var(--purple-lt);
    border-radius: 50%; cursor: pointer;
    box-shadow: 0 2px 8px rgba(124, 106, 255, 0.5);
  }

  select {
    width: 100%; padding: 8px 12px;
    background: var(--bg);
    border: 1px solid var(--card-hi); border-radius: 8px;
    color: var(--off); font-size: 13px;
    font-family: inherit; outline: none; cursor: pointer;
  }

  .btn-reset {
    width: 100%; padding: 10px;
    background: transparent;
    border: 1px solid var(--dim);
    color: var(--muted); border-radius: 8px;
    font-size: 12px; cursor: pointer;
    transition: 0.15s; font-family: inherit;
  }
  .btn-reset:hover { border-color: var(--coral); color: var(--coral); }

  /* ============ 결과 그리드 ============ */
  .results { min-height: 400px; }
  .results-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; padding: 0 4px;
  }
  .results-count { color: var(--muted); font-size: 14px; }
  .results-count b { color: var(--teal); font-size: 16px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);   /* 가로 5개 */
    gap: 16px;
  }

  .movie {
    background: var(--card);
    border: 1px solid var(--card-hi);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.25s;
    position: relative;
  }
  .movie:hover {
    transform: translateY(-4px);
    border-color: var(--purple-lt);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
  }
  .poster {
    width: 100%; aspect-ratio: 2 / 3;
    background: var(--bg-deep);
    position: relative; overflow: hidden;
  }
  .poster img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  .poster.no-image {
    background: linear-gradient(135deg,
      hsl(var(--fallback-hue, 260), 60%, 50%) 0%,
      hsl(calc(var(--fallback-hue, 260) + 60), 65%, 45%) 100%);
    display: flex; align-items: center; justify-content: center;
    color: white; position: relative; overflow: hidden;
  }
  .poster.no-image::before {
    content: "🎬"; position: absolute;
    font-size: 100px; opacity: 0.2;
    right: -15px; bottom: -25px;
    transform: rotate(-15deg);
  }
  .poster.no-image::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.2), transparent 50%);
  }
  .rating-badge {
    position: absolute; top: 10px; right: 10px;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(8px);
    color: var(--yellow);
    padding: 4px 10px; border-radius: 12px;
    font-size: 12px; font-weight: bold;
    display: flex; align-items: center; gap: 4px;
  }
  .movie-info { padding: 12px; }
  .movie-title {
    font-size: 14px; font-weight: bold;
    color: var(--text); margin-bottom: 4px;
    overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    min-height: 36px;
  }
  .movie-meta { color: var(--muted); font-size: 11px; }

  .overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(18, 21, 46, 0.98) 60%, transparent);
    padding: 16px;
    display: flex; flex-direction: column; justify-content: flex-end;
    opacity: 0; transition: opacity 0.25s;
    pointer-events: none;
  }
  .movie:hover .overlay { opacity: 1; }
  .overview {
    color: var(--off); font-size: 11px; line-height: 1.5;
    overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical;
  }

  /* ============ 로딩 / 빈 상태 ============ */
  .loading, .empty {
    text-align: center; padding: 80px 20px; color: var(--muted);
  }
  .loading .spinner {
    display: inline-block;
    width: 40px; height: 40px;
    border: 3px solid var(--card-hi);
    border-top-color: var(--purple);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty h2 { color: var(--off); font-size: 22px; margin: 16px 0 8px; }
  .empty p { color: var(--muted); font-size: 14px; }
  .empty .emoji { font-size: 48px; }

  /* ============ 인물 검색 결과 (목록 뷰) ============ */
  .person-section {
    margin-bottom: 28px;
  }
  .person-section-title {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    color: var(--pink);
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 14px;
    white-space: nowrap;
  }
  .person-section-title .count {
    background: var(--pink);
    color: white;
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 12px;
    font-weight: bold;
  }
  .person-section-title .hint {
    font-size: 11px;
    color: var(--dim);
    font-weight: normal;
    white-space: normal;
  }
  .person-results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 180px));
    gap: 12px;
    justify-content: start;
  }
  .person-result-card {
    background: var(--card);
    border: 1px solid var(--card-hi);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.2s;
  }
  .person-result-card:hover {
    transform: translateY(-4px);
    border-color: var(--pink);
    box-shadow: 0 12px 26px rgba(255,107,157,0.3);
  }
  .person-result-photo {
    width: 100%;
    aspect-ratio: 1;
    background: var(--bg-deep);
    position: relative;
    overflow: hidden;
  }
  .person-result-photo img { width: 100%; height: 100%; object-fit: cover; }
  .person-result-photo.no-image {
    background: linear-gradient(135deg,
      hsl(var(--fallback-hue, 320), 55%, 45%),
      hsl(calc(var(--fallback-hue, 320) + 40), 60%, 40%));
    display: flex; align-items: center; justify-content: center;
    font-size: 52px;
    color: rgba(255,255,255,0.5);
  }
  .person-result-info { padding: 10px 12px; }
  .person-result-name {
    color: var(--text);
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .person-result-known {
    color: var(--muted);
    font-size: 10px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .person-result-known::before { content: '🎬 '; }

  /* 섹션 구분자 */
  .results-section-title {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--teal);
    font-size: 16px;
    font-weight: bold;
    margin: 8px 0 14px;
  }
  .results-section-title .count {
    background: var(--teal);
    color: var(--bg);
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 12px;
  }

  /* ============ 상세 뷰 공통 ============ */
  .detail-container {
    max-width: 1200px;
    margin: 0 auto;
  }
  .back-btn {
    display: inline-flex;
    flex-shrink: 0;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    background: var(--card);
    border: 1px solid var(--card-hi);
    color: var(--off);
    border-radius: 30px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    margin-bottom: 20px;
    transition: 0.2s;
  }
  .back-btn:hover {
    background: var(--purple);
    border-color: var(--purple);
    color: white;
    transform: translateX(-4px);
  }

  /* ============ 영화 상세: 히어로 (backdrop + 포스터) ============ */
  .movie-hero {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    background: var(--card);
    border: 1px solid var(--card-hi);
    margin-bottom: 32px;
  }
  .backdrop {
    height: 380px;
    background-size: cover;
    background-position: center;
    background-color: var(--bg-deep);
    background-image: linear-gradient(135deg,
      hsl(var(--hero-hue, 260), 55%, 30%),
      hsl(calc(var(--hero-hue, 260) + 60), 60%, 25%));
    position: relative;
  }
  .backdrop::after {
    content: '';
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, transparent 20%, rgba(27, 30, 58, 0.5) 60%, var(--card) 100%),
      linear-gradient(90deg, rgba(27, 30, 58, 0.7) 0%, transparent 50%);
  }
  .backdrop::before {
    content: '🎬';
    position: absolute;
    right: 8%;
    top: 30%;
    font-size: 120px;
    opacity: 0.15;
    z-index: 1;
  }
  .hero-content {
    position: relative;
    padding: 30px;
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 30px;
    margin-top: -160px;
    z-index: 2;
  }
  .hero-poster {
    width: 220px;
    aspect-ratio: 2/3;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    background: var(--bg-deep);
    border: 2px solid var(--card-hi);
    position: relative;
  }
  .hero-poster img { width: 100%; height: 100%; object-fit: cover; }
  .hero-poster.no-image {
    background: linear-gradient(135deg,
      hsl(var(--hero-hue, 260), 60%, 45%),
      hsl(calc(var(--hero-hue, 260) + 60), 65%, 40%));
    display: flex; align-items: center; justify-content: center;
  }
  .hero-poster.no-image::before {
    content: '🎬';
    font-size: 90px;
    opacity: 0.4;
  }
  .hero-info { padding-top: 160px; }
  .hero-info h1 {
    font-size: 34px;
    color: var(--text);
    margin-bottom: 6px;
    line-height: 1.2;
  }
  .hero-original {
    font-size: 15px;
    color: var(--muted);
    font-style: italic;
    margin-bottom: 16px;
  }
  .hero-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 18px;
    color: var(--muted);
    font-size: 13px;
  }
  .hero-meta .item {
    display: flex; align-items: center; gap: 5px;
  }
  .hero-meta .rating {
    color: var(--yellow);
    font-weight: bold;
    font-size: 15px;
  }
  .genre-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  .genre-tag {
    padding: 4px 12px;
    background: rgba(124, 106, 255, 0.15);
    border: 1px solid var(--purple);
    color: var(--purple-lt);
    border-radius: 14px;
    font-size: 11px;
  }
  .tagline {
    color: var(--teal);
    font-style: italic;
    font-size: 15px;
    margin-bottom: 16px;
  }
  .overview-full {
    color: var(--off);
    font-size: 14px;
    line-height: 1.75;
    margin-bottom: 20px;
  }
  .directors {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 8px;
  }
  .directors .name {
    color: var(--pink);
    cursor: pointer;
    font-weight: bold;
  }
  .directors .name:hover { text-decoration: underline; }

  /* ============ 섹션 헤더 ============ */
  .section-title {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 28px 0 16px;
    font-size: 20px;
    color: var(--off);
  }
  .section-title .count {
    background: var(--purple);
    color: white;
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 12px;
    font-weight: bold;
  }

  /* ============ 캐스트 가로 스크롤 ============ */
  .cast-row {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    padding-bottom: 12px;
    scrollbar-width: thin;
    scrollbar-color: var(--purple) var(--card);
  }
  .cast-row::-webkit-scrollbar { height: 8px; }
  .cast-row::-webkit-scrollbar-track { background: var(--card); border-radius: 4px; }
  .cast-row::-webkit-scrollbar-thumb { background: var(--purple); border-radius: 4px; }

  .cast-card {
    flex: 0 0 130px;
    background: var(--card);
    border: 1px solid var(--card-hi);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.2s;
  }
  .cast-card:hover {
    transform: translateY(-4px);
    border-color: var(--pink);
    box-shadow: 0 8px 20px rgba(255, 107, 157, 0.3);
  }
  .cast-photo {
    width: 100%;
    aspect-ratio: 1;
    background: var(--bg-deep);
    position: relative;
    overflow: hidden;
  }
  .cast-photo img { width: 100%; height: 100%; object-fit: cover; }
  .cast-photo.no-image {
    background: linear-gradient(135deg,
      hsl(var(--fallback-hue, 200), 40%, 30%),
      hsl(calc(var(--fallback-hue, 200) + 40), 45%, 35%));
    display: flex; align-items: center; justify-content: center;
    font-size: 44px;
    color: rgba(255,255,255,0.4);
  }
  .cast-info { padding: 10px; }
  .cast-name {
    color: var(--text);
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cast-character {
    color: var(--pink);
    font-size: 10.5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cast-character::before { content: '🎭 '; }

  /* ============ 예고편 ============ */
  .trailer-wrap {
    position: relative;
    padding-top: 56.25%;
    background: black;
    border-radius: 12px;
    overflow: hidden;
    max-width: 720px;
  }
  /* 예고편 미리보기 (클릭하면 유튜브에서 열림) */
  .trailer-thumb {
    position: relative;
    display: block;
    max-width: 720px;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    background: #000;
  }
  .trailer-thumb img { width: 100%; display: block; }
  .trailer-thumb .play-btn {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 88px; height: 62px;
    background: rgba(220, 30, 30, 0.92);
    border-radius: 14px;
    color: #fff;
    font-size: 28px;
    display: flex; align-items: center; justify-content: center;
    transition: 0.15s;
  }
  .trailer-thumb:hover .play-btn { background: #ff0000; transform: translate(-50%,-50%) scale(1.1); }
  .trailer-note {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: rgba(18, 21, 46, 0.85);
    color: var(--off);
    font-size: 12px;
    text-align: center;
    padding: 8px 12px;
  }

  .trailer-wrap iframe {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: none;
  }

    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));

  }
  .similar-movie {

    border: 1px solid var(--card-hi);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.2s;

    transform: scale(1.04);
    border-color: var(--teal);

  .similar-movie .movie-title { font-size: 12px; min-height: 32px; }

    background: var(--card);
    border-radius: 20px;
    border: 1px solid var(--card-hi);
    padding: 30px;
    margin-bottom: 30px;
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 30px;
  }
  .person-photo {
    width: 220px;
    aspect-ratio: 2/3;
    border-radius: 12px;
    overflow: hidden;
    background: var(--bg-deep);
    border: 2px solid var(--card-hi);
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    position: relative;

    background: linear-gradient(135deg, var(--purple), var(--pink));
    display: flex;
    align-items: center;
    justify-content: center;

  .person-photo.no-image::before {
    content: '👤';
    font-size: 100px;
    opacity: 0.6;
  }
  .person-info h1 {
    font-size: 32px;
    color: var(--text);
    margin-bottom: 4px;
  }
  .person-info h2 {
    font-size: 14px;
    color: var(--muted);
    font-weight: normal;
    font-style: italic;
    margin-bottom: 20px;
  }
  .person-facts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .fact {
    background: var(--bg-deep);
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--card-hi);
  }
  .fact-label {
    color: var(--dim);
    font-size: 10px;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .fact-value {
    color: var(--off);
    font-size: 13px;
    font-weight: bold;
  }
  .bio-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .bio-label { font-size: 11px; font-weight: bold; color: var(--teal); }
  .bio-toggle {
    margin-left: auto;
    padding: 4px 10px;
    background: var(--card-hi);
    border: 1px solid var(--teal);
    border-radius: 7px;
    color: var(--teal);
    font-family: inherit;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;

  .bio-toggle:hover { background: var(--card); }

  .bio {
    color: var(--off);
    font-size: 13px;
    line-height: 1.75;

    .backdrop { height: 240px; }
    .person-container { grid-template-columns: 1fr; text-align: center; }
    .person-photo { margin: 0 auto; }
  }

  footer {
    text-align: center;
    padding: 40px 0 10px;
    color: var(--dim);
    font-size: 11px;

// ============================================================
// 라우팅 (URL 해시 기반)
// ============================================================
window.addEventListener("hashchange", handleRoute);

function handleRoute() {
  const hash = window.location.hash;
  if (hash.startsWith("#movie/")) {
    const id = hash.split("/")[1];
    showMovieDetail(id);
  } else if (hash.startsWith("#person/")) {
    const id = hash.split("/")[1];
    showPersonDetail(id);
  } else {
    showListView();
  }
  window.scrollTo({ top: 0, behavior: 'instant' });
}

// 뒤로 가기용 이동 기록.
// 브라우저 히스토리로 되돌리면 00.index.html 처럼 아이프레임 안에서 열렸을 때
// 페이지 전체가 밖으로 나가버리므로 직접 기록을 남긴다.
const navStack = [];

function goToMovie(id)  { navStack.push(window.location.hash); window.location.hash = `#movie/${id}`; }
function goToPerson(id) { navStack.push(window.location.hash); window.location.hash = `#person/${id}`; }
function goHome() {
  navStack.length = 0;
  window.location.hash = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function goBack()       { window.location.hash = navStack.length ? navStack.pop() : ''; }

// ============================================================
// 뷰 전환
// ============================================================
function showListView() {
  document.getElementById("listView").classList.remove("hidden");
  document.getElementById("detailView").classList.add("hidden");
}

function showDetailView() {
  document.getElementById("listView").classList.add("hidden");
  document.getElementById("detailView").classList.remove("hidden");
}

// ============================================================
// 초기화
// ============================================================
function init() {
  renderGenreChips();
  setupEventListeners();
  if (DEMO_MODE) {
    document.getElementById("demoBadge").style.display = "inline-block";
  }
  handleRoute();
  if (!window.location.hash) search(); // 첫 로딩
}

function renderGenreChips() {
  const container = document.getElementById("genreChips");
  container.innerHTML = GENRES.map(g =>
    `<div class="chip" data-id="${g.id}" onclick="toggleGenre(${g.id}, this)">
       ${g.emoji} ${g.name}
     </div>`
  ).join("");
}

function toggleGenre(id, el) {
  if (selectedGenres.has(id)) {
    selectedGenres.delete(id);
    el.classList.remove("active");
  } else {
    selectedGenres.add(id);
    el.classList.add("active");
  }
  search();
}

function setupEventListeners() {
  let searchTimer;
  document.getElementById("searchInput").addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(search, 400);
  });
  document.getElementById("yearInput").addEventListener("input", (e) => {
    document.getElementById("yearVal").textContent = e.target.value;
  });
  document.getElementById("yearInput").addEventListener("change", search);
  document.getElementById("ratingInput").addEventListener("input", (e) => {
    document.getElementById("ratingVal").textContent = Number(e.target.value).toFixed(1);
  });
  document.getElementById("ratingInput").addEventListener("change", search);
  document.getElementById("sortSelect").addEventListener("change", search);
}

// ============================================================
// 🔍 검색 (핵심 fetch) - 영화 + 인물 병렬로!
// ============================================================
// 지금 보고 있는 목록의 상태 (더 불러오기에 필요)
let listState = { page: 1, totalPages: 1, totalResults: 0, loading: false, movies: [] };

async function search() {
  listState = { page: 1, totalPages: 1, totalResults: 0, loading: false, movies: [] };
  await runSearch(1);
}

// page가 1이면 새로 그리고, 2 이상이면 뒤에 이어 붙인다
async function runSearch(page) {
  const query   = document.getElementById("searchInput").value.trim();
  const year    = document.getElementById("yearInput").value;
  const rating  = document.getElementById("ratingInput").value;
  const sortBy  = document.getElementById("sortSelect").value;

  if (page === 1) showLoading();
  listState.loading = true;

  try {
    let movies = [];
    let persons = [];

    if (DEMO_MODE) {
      await new Promise(r => setTimeout(r, 300));

      if (query) {
        // 검색 모드: 필터 무시, 제목 매칭만 (실제 /search/movie와 동일 동작)
        movies = DEMO_MOVIES.filter(m => m.title.includes(query));

        // 인물 검색 (이름 매칭)
        persons = Object.values(DEMO_PERSONS)
          .filter(p => p.name.includes(query) ||
                       (p.also_known_as && p.also_known_as.some(n => n.toLowerCase().includes(query.toLowerCase()))));
      } else {
        // 발견 모드: 필터 적용 (실제 /discover/movie와 동일 동작)
        movies = DEMO_MOVIES.filter(m => {
          const y = parseInt(m.release_date);
          if (y < parseInt(year)) return false;
          if (m.vote_average < parseFloat(rating)) return false;
          return true;
        });
        if (sortBy === "vote_average.desc") movies.sort((a,b) => b.vote_average - a.vote_average);
        else if (sortBy === "primary_release_date.desc") movies.sort((a,b) => b.release_date.localeCompare(a.release_date));
      }
      listState.totalPages = 1;                 // 데모 데이터는 한 묶음뿐
      listState.totalResults = movies.length;
    } else {
      if (query) {
        // 🚀 영화 + 인물 동시에 검색! (Promise.all - 7주차 배운 것 활용)
        const movieUrl  = `${BASE}/search/movie?api_key=${API_KEY}&language=ko-KR&query=${encodeURIComponent(query)}&page=${page}`;
        const personUrl = `${BASE}/search/person?api_key=${API_KEY}&language=ko-KR&query=${encodeURIComponent(query)}`;

        const [movieRes, personRes] = await Promise.all([
          fetch(movieUrl).then(r => r.json()),
          fetch(personUrl).then(r => r.json()),
        ]);

        movies  = movieRes.results  || [];
        persons = page === 1 ? (personRes.results || []).slice(0, 8) : [];   // 인물은 첫 페이지만
        listState.totalPages   = movieRes.total_pages   || 1;
        listState.totalResults = movieRes.total_results || movies.length;
      } else {
        // 검색어 없으면 필터 기반 발견
        const url = `${BASE}/discover/movie?api_key=${API_KEY}&language=ko-KR`
              + `&sort_by=${sortBy}`
              + `&primary_release_date.gte=${year}-01-01`
              + `&vote_average.gte=${rating}`
              + `&vote_count.gte=100`
              + `&page=${page}`
              + (selectedGenres.size > 0 ? `&with_genres=${[...selectedGenres].join(",")}` : "");
        const res = await fetch(url);
        const data = await res.json();
        movies = data.results || [];
        listState.totalPages   = Math.min(data.total_pages || 1, 500);   // TMDB는 500페이지까지
        listState.totalResults = data.total_results || movies.length;
      }
    }
    listState.page = page;
    if (page === 1) {
      listState.movies = movies;
      render(movies, persons);
    } else {
      appendMovies(movies);
    }
  } catch (err) {
    console.error(err);
    if (page === 1) showError(err.message);
  } finally {
    listState.loading = false;
    updateLoadMore();
  }
}

// ============================================================
// ⬇️ 더 보기 / 스크롤 끝에서 자동으로 불러오기
// ============================================================
async function loadMore() {
  if (listState.loading) return;                       // 이미 불러오는 중이면 무시
  if (listState.page >= listState.totalPages) return;  // 마지막 페이지면 끝
  const btn = document.getElementById("loadMoreBtn");
  if (btn) { btn.disabled = true; btn.textContent = "불러오는 중..."; }
  await runSearch(listState.page + 1);
}

// 새로 받은 영화들을 목록 뒤에 붙인다
function appendMovies(movies) {
  const grid = document.getElementById("movieGrid");
  if (!grid || movies.length === 0) return;

  // 이미 있는 영화는 건너뛴다 (페이지가 겹칠 때 중복 방지)
  const have = new Set(listState.movies.map(m => m.id));
  const fresh = movies.filter(m => !have.has(m.id));
  listState.movies = listState.movies.concat(fresh);

  const startIdx = grid.children.length;
  grid.insertAdjacentHTML("beforeend",
    fresh.map((m, i) => movieCardHtml(m, startIdx + i)).join(""));

  document.getElementById("countLabel").innerHTML =
    `영화 <b style="color:var(--teal);">${listState.movies.length}</b>편` +
    (listState.totalResults > listState.movies.length
      ? ` <span style="color:var(--dim);font-size:12px;">/ 전체 ${listState.totalResults.toLocaleString()}편</span>` : "");
}

// [더 보기] 버튼 상태 갱신
function updateLoadMore() {
  const wrap = document.getElementById("loadMoreWrap");
  if (!wrap) return;
  const btn = document.getElementById("loadMoreBtn");
  const info = document.getElementById("loadMoreInfo");
  const hasMore = listState.page < listState.totalPages;

  wrap.style.display = listState.movies.length > 0 ? "flex" : "none";
  if (btn) {
    btn.style.display = hasMore ? "" : "none";
    btn.disabled = false;
    btn.textContent = "⬇️ 더 보기";
  }
  if (info) {
    info.textContent = hasMore
      ? `${listState.page} / ${listState.totalPages} 페이지 · 아래로 내리면 자동으로 더 불러와요`
      : (listState.movies.length ? "마지막이에요! 모든 영화를 다 봤어요 🎬" : "");
  }
}

// 목록 맨 아래가 화면에 들어오면 자동으로 다음 페이지를 부른다
let listObserver = null;
function setupAutoLoad() {
  const sentinel = document.getElementById("scrollSentinel");
  if (!sentinel) return;
  if (listObserver) listObserver.disconnect();
  listObserver = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting) loadMore();
  }, { rootMargin: "200px" });    // 조금 미리 불러와서 끊김 없이
  listObserver.observe(sentinel);
}

// ============================================================
// 🎨 목록 그리기 (인물 + 영화)
// ============================================================
function render(movies, persons = []) {
  hideLoading();
  const grid = document.getElementById("resultsGrid");
  const count = document.getElementById("countLabel");

  // 카운트 라벨
  if (persons.length > 0) {
    count.innerHTML = `영화 <b style="color:var(--teal);">${movies.length}</b>편 · 인물 <b style="color:var(--pink);">${persons.length}</b>명`;
  } else {
    count.innerHTML = `영화 <b style="color:var(--teal);">${movies.length}</b>편`;
  }

  // 완전히 빈 결과
  if (movies.length === 0 && persons.length === 0) {
    grid.innerHTML = "";
    document.getElementById("emptyBox").style.display = "block";
    return;
  }
  document.getElementById("emptyBox").style.display = "none";

  let html = "";

  // 인물 섹션 (검색 결과 있을 때만)
  if (persons.length > 0) {
    html += `
      <div class="person-section">
        <div class="person-section-title">
          👤 이름과 일치하는 인물 <span class="count">${persons.length}</span>
          <span class="hint">· 클릭하면 그 배우·감독의 작품이 다 보여요</span>
        </div>
        <div class="person-results-grid">
          ${persons.map((p, i) => personResultCardHtml(p, i)).join("")}
        </div>
      </div>
    `;
  }

  // 영화 섹션
  if (movies.length > 0) {
    if (persons.length > 0) {
      html += `<div class="results-section-title">🎬 관련 영화 <span class="count">${movies.length}</span></div>`;
    }
    html += `<div class="grid" id="movieGrid">${movies.map((m, idx) => movieCardHtml(m, idx)).join("")}</div>`;
  } else if (persons.length > 0) {
    // 인물만 나오고 영화는 없을 때
    html += `
      <div class="empty" style="padding: 40px 20px;">
        <div class="emoji">🎬</div>
        <p>제목이 일치하는 영화는 없어요. 위 인물을 클릭해서 필모그래피 확인!</p>
      </div>
    `;
  }

  // 목록 끝: [더 보기] 버튼 + 자동 불러오기 감지용 표시점
  html += `
    <div class="load-more-wrap" id="loadMoreWrap" style="display:none;">
      <button class="load-more-btn" id="loadMoreBtn" onclick="loadMore()">⬇️ 더 보기</button>
      <div class="load-more-info" id="loadMoreInfo"></div>
      <div id="scrollSentinel" style="height:1px;"></div>
    </div>`;

  grid.innerHTML = html;
  updateLoadMore();
  setupAutoLoad();
}

// 인물 검색 결과 카드 HTML
function personResultCardHtml(p, idx = 0) {
  const hue = (idx * 53 + 320) % 360;
  const photoHtml = p.profile_path
    ? `<img src="${IMG_BASE}${p.profile_path}" alt="${p.name}" loading="lazy" onerror="this.parentElement.classList.add('no-image'); this.parentElement.style.setProperty('--fallback-hue', '${hue}deg'); this.remove();">`
    : ``;
  const noImageClass = p.profile_path ? '' : 'no-image';
  const hueStyle = !p.profile_path ? `style="--fallback-hue: ${hue}deg;"` : '';

  // "known_for" - 이 사람이 유명해진 작품 (TMDB API 반환)
  let knownForTitles = "";
  if (p.known_for && p.known_for.length > 0) {
    knownForTitles = p.known_for.map(k => k.title || k.name).filter(Boolean).slice(0, 2).join(", ");
  } else if (p.movie_credits && p.movie_credits.cast && p.movie_credits.cast.length > 0) {
    // 데모 모드
    knownForTitles = p.movie_credits.cast.slice(0, 2).map(m => m.title).join(", ");
  }

  const roleMap = { "Acting": "배우", "Directing": "감독", "Writing": "작가", "Production": "제작" };
  const role = roleMap[p.known_for_department] || "";
  const subLine = knownForTitles || role || "정보 없음";

  return `
    <div class="person-result-card" onclick="goToPerson(${p.id})">
      <div class="person-result-photo ${noImageClass}" ${hueStyle}>
        ${photoHtml || '👤'}
      </div>
      <div class="person-result-info">
        <div class="person-result-name">${p.name}</div>
        <div class="person-result-known">${subLine}</div>
      </div>
    </div>
  `;
}

// 공용 영화 카드 HTML (목록·비슷한영화·필모그래피 모두 사용)
function movieCardHtml(m, idx = 0) {
  const year = m.release_date ? m.release_date.substring(0, 4) : "?";
  const rating = m.vote_average ? m.vote_average.toFixed(1) : "?";
  const hue = (idx * 47) % 360;
  const posterHtml = m.poster_path
    ? `<img src="${IMG_BASE}${m.poster_path}" alt="${m.title}" loading="lazy" onerror="this.parentElement.classList.add('no-image'); this.parentElement.style.setProperty('--fallback-hue', '${hue}deg'); this.remove();">`
    : ``;
  const noImageClass = m.poster_path ? '' : 'no-image';
  const hueStyle = !m.poster_path ? `style="--fallback-hue: ${hue}deg;"` : '';
  return `
    <div class="movie" onclick="goToMovie(${m.id})">
      <div class="poster ${noImageClass}" ${hueStyle}>
        ${posterHtml}
        <div class="rating-badge">⭐ ${rating}</div>
        <div class="overlay"><div class="overview">${m.overview || "줄거리 정보가 없어요"}</div></div>
      </div>
      <div class="movie-info">
        <div class="movie-title">${m.title}</div>
        <div class="movie-meta">${year}</div>
      </div>
    </div>
  `;
}

function showLoading() {
  document.getElementById("loadingBox").style.display = "block";
  document.getElementById("emptyBox").style.display = "none";
}
function hideLoading() {
  document.getElementById("loadingBox").style.display = "none";
}
function showError(msg) {
  hideLoading();
  document.getElementById("resultsGrid").innerHTML =
    `<div class="empty" style="grid-column:1/-1;">

      movie = DEMO_MOVIE_DETAILS[id];

// 데모 모드에서 기본 정보만 있는 영화의 상세뷰 만들기

function renderMovieDetail(m) {

  const runtime = m.runtime ? `${Math.floor(m.runtime/60)}시간 ${m.runtime%60}분` : "";

  const cast = (m.credits?.cast || []).slice(0, 15);

                || (m.videos?.results || []).find(v => v.site === "YouTube");
  // 비슷한 영화도 정렬해서 보여준다 (기본: 최신순)
  similarMovies = (m.similar?.results || []).filter(s => s.release_date);
  const similar = sortFilms(similarMovies, similarSort).slice(0, 8);

  const heroHue = (m.id * 47) % 360;

    : `--hero-hue:${heroHue}deg;`;

    ? `<img src="${IMG_BASE_LG}${m.poster_path}" alt="${m.title}" onerror="this.parentElement.classList.add('no-image'); this.remove();">`
    : ``;
  const posterClass = m.poster_path ? '' : 'no-image';

          </div>
          ${m.genres && m.genres.length ? `
            <div class="genre-tags">
              ${m.genres.map(g => `<span class="genre-tag">${g.name}</span>`).join("")}
            </div>` : ''}

          <div class="overview-full">${m.overview || "줄거리 정보가 없어요"}</div>
          ${directors.length ? `
            <div class="directors">
              🎬 감독: ${directors.map(d =>
                `<span class="name" onclick="goToPerson(${d.id})">${d.name}</span>`
              ).join(", ")}
            </div>` : ''}
        </div>
      </div>
    </div>

    ${cast.length ? `
      <div class="section-title">
        👥 등장인물 <span class="count">${cast.length}</span>

      </div>
      <div class="cast-row">
        ${cast.map((c, i) => castCardHtml(c, i)).join("")}

    ` : ''}

    ${trailer ? `
      <div class="section-title">🎥 예고편</div>
      <div class="trailer-thumb" onclick="window.open('https://www.youtube.com/watch?v=${trailer.key}','_blank')"

function castCardHtml(c, idx = 0) {
  const hue = (idx * 53) % 360;
  const photoHtml = c.profile_path
    ? `<img src="${IMG_BASE}${c.profile_path}" alt="${c.name}" loading="lazy" onerror="this.parentElement.classList.add('no-image'); this.parentElement.style.setProperty('--fallback-hue', '${hue}deg'); this.remove();">`
    : ``;
  const noImageClass = c.profile_path ? '' : 'no-image';
  const hueStyle = !c.profile_path ? `style="--fallback-hue: ${hue}deg;"` : '';
  return `
    <div class="cast-card" onclick="goToPerson(${c.id})">
      <div class="cast-photo ${noImageClass}" ${hueStyle}>
        ${photoHtml || '👤'}
      </div>
      <div class="cast-info">
        <div class="cast-name">${c.name}</div>
        <div class="cast-character">${c.character || ''}</div>
      </div>
    </div>
  `;
}

// ============================================================
// 🔃 대표작 정렬 (평점순 / 최신순)
// ============================================================
let filmSort = "date";       // 대표작 정렬 기준 (기본: 최신순)
let personFilms = [];        // 지금 보고 있는 인물의 작품 목록(정렬 전)
let similarSort = "date";    // 비슷한 영화 정렬 기준 (기본: 최신순)
let similarMovies = [];      // 지금 보고 있는 영화의 '비슷한 영화' 목록(정렬 전)

function sortFilms(list, mode) {
  const copy = [...list];    // 원본은 그대로 두고 복사본을 정렬한다
  if (mode === "date") {
    copy.sort((a, b) => (b.release_date || "").localeCompare(a.release_date || ""));
  } else {
    copy.sort((a, b) => (b.vote_average || 0) - (a.vote_average || 0));
  }
  return copy.slice(0, 12);  // 너무 많으면 12편까지만
}

// 비슷한 영화만 다시 정렬해서 그린다 (영화 정보는 그대로)
function setSimilarSort(mode) {
  similarSort = mode;
  document.querySelectorAll(".similar-grid").forEach(() => {});   // (그리드는 아래에서 다시 그린다)

  // 버튼 색 바꾸기 — '비슷한 영화' 제목 줄에 있는 버튼만 고른다
  const grid = document.getElementById("similarGrid");
  if (!grid) return;
  const tabs = grid.previousElementSibling ? grid.previousElementSibling.querySelectorAll(".sort-tab") : [];
  tabs.forEach(btn => {
    btn.classList.toggle("active", btn.textContent.includes(mode === "rating" ? "평점" : "최신"));
  });

  grid.innerHTML = sortFilms(similarMovies, similarSort)
    .slice(0, 8).map((s, i) => movieCardHtml(s, i)).join("");
}

function setFilmSort(mode) {
  filmSort = mode;
  // 버튼 색 바꾸기
  document.querySelectorAll(".sort-tab").forEach(btn => {
    btn.classList.toggle("active", btn.textContent.includes(mode === "rating" ? "평점" : "최신"));
  });
  // 목록만 다시 그린다 (사진·소개는 그대로)
  const grid = document.getElementById("filmGrid");
  if (grid) {
    grid.innerHTML = sortFilms(personFilms, filmSort)
      .map((f, i) => movieCardHtml(f, i)).join("");
  }
}

// ============================================================
// 🌐 소개 번역 (구글 번역 → 실패하면 MyMemory)
//   한 번 번역한 글은 localStorage에 저장해 다시 부르지 않는다
// ============================================================
const BIO_CACHE_KEY = "movieBioCache";

function bioCacheGet(key) {
  try { return (JSON.parse(localStorage.getItem(BIO_CACHE_KEY) || "{}"))[key] || null; }
  catch { return null; }
}
function bioCacheSet(key, value) {
  try {
    const c = JSON.parse(localStorage.getItem(BIO_CACHE_KEY) || "{}");
    c[key] = value;
    const keys = Object.keys(c);
    if (keys.length > 60) delete c[keys[0]];
    localStorage.setItem(BIO_CACHE_KEY, JSON.stringify(c));
  } catch {}
}
function bioKey(text) {
  let h = 0;
  for (let i = 0; i < text.length; i++) h = (h * 31 + text.charCodeAt(i)) | 0;
  return "b" + h;
}

// 긴 글은 문장 단위로 잘라서 보낸다 (URL 길이 제한 때문)
function splitText(text, limit) {
  const parts = [];
  let buf = "";
  for (const s of text.split(/(?<=[.!?])\s+/)) {
    if (buf && (buf + s).length > limit) { parts.push(buf); buf = ""; }
    buf += s + " ";
  }
  if (buf.trim()) parts.push(buf.trim());
  return parts;
}

async function transByGoogle(text) {
  const out = [];
  for (const chunk of splitText(text, 1200)) {
    const res = await fetch("https://translate.googleapis.com/translate_a/single"
      + "?client=gtx&sl=en&tl=ko&dt=t&q=" + encodeURIComponent(chunk));
    if (!res.ok) throw new Error("google " + res.status);
    const data = await res.json();
    out.push(data[0].map(p => p[0]).join(""));
  }
  return out.join(" ");
}

async function transByMyMemory(text) {
  const out = [];
  for (const chunk of splitText(text, 450)) {
    const res = await fetch("https://api.mymemory.translated.net/get?langpair=en|ko&q="
      + encodeURIComponent(chunk));
    if (!res.ok) throw new Error("mymemory " + res.status);
    const data = await res.json();
    out.push(data.responseData.translatedText);
  }
  return out.join(" ");
}

let bioKorean = "";
let bioEnglish = "";
let bioShowingKo = true;

async function translateBio(englishText) {
  const box = document.getElementById("bioBox");
  const btn = document.getElementById("bioToggle");
  const label = document.getElementById("bioLabel");
  if (!box) return;

  bioEnglish = englishText;
  bioShowingKo = true;
  const key = bioKey(englishText);

  const cached = bioCacheGet(key);
  if (cached) {
    bioKorean = cached;
    label.textContent = "📖 소개 (한글 번역)";
    box.textContent = bioKorean;
    btn.style.display = "";
    return;
  }

  label.textContent = "📖 소개";
  box.textContent = "한국어로 번역하는 중...";

  try {
    bioKorean = await transByGoogle(englishText);
  } catch {
    try { bioKorean = await transByMyMemory(englishText); }
    catch {
      // 번역 실패 → 영어 원문 그대로
      box.textContent = englishText;
      label.textContent = "📖 소개 (영어 원문)";
      return;
    }
  }
  bioCacheSet(key, bioKorean);

  // 그 사이 다른 인물로 넘어갔으면 덮어쓰지 않는다
  if (document.getElementById("bioBox") !== box) return;
  box.textContent = bioKorean;
  label.textContent = "📖 소개 (한글 번역)";
  btn.style.display = "";
}

function toggleBio() {
  const box = document.getElementById("bioBox");
  const btn = document.getElementById("bioToggle");
  const label = document.getElementById("bioLabel");
  bioShowingKo = !bioShowingKo;
  box.textContent = bioShowingKo ? bioKorean : bioEnglish;
  label.textContent = bioShowingKo ? "📖 소개 (한글 번역)" : "📖 소개 (영어 원문)";
  btn.textContent = bioShowingKo ? "🇺🇸 영어 원문" : "🇰🇷 한글 번역";
}
